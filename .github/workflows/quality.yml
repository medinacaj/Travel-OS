name: Quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar permisos documentados
        run: node tests/security_schema.mjs
      - name: Construir aplicación
        run: npm run build
      - name: Preparar navegador de pruebas
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
          npm install --prefix /tmp/leafletpkg --no-audit --no-fund leaflet@1.9.4
      - name: Experiencia E2E y móvil con datos ficticios
        run: python tests/e2e.py
      - name: E2E de autenticación/almacenamiento simulado
        run: python tests/e2e_cloud.py
